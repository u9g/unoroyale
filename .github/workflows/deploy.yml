name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # OTA bundle: the zip lives on a release (Pages is replaced on every deploy); latest.json points at it
      - run: |
          VERSION=${GITHUB_SHA::7}
          (cd dist && zip -qr ../bundle.zip .)
          gh release create "bundle-$VERSION" bundle.zip --title "bundle $VERSION" --notes "$GITHUB_SHA"
          echo "{\"version\":\"$VERSION\",\"url\":\"https://github.com/$GITHUB_REPOSITORY/releases/download/bundle-$VERSION/bundle.zip\"}" > dist/latest.json
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
